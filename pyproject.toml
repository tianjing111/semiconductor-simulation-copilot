[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semiconductor-simulation-copilot"
version = "0.1.0"
description = "Evidence-grounded assistant for semiconductor simulation workflows"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Simulation Copilot Contributors"}]
dependencies = []

[project.scripts]
simulation-copilot = "simulation_copilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

